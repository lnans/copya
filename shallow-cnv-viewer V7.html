<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visionneuse shallow genome</title>
<script src="https://cdn.jsdelivr.net/npm/igv@3/dist/igv.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#1b2733;--mute:#5d6b7a;--line:#d3dae1;--acc:#0d6b6b;--warn:#b4432a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:12px;align-items:baseline}
h1{font-size:18px;margin:0;font-weight:650}
header span{color:var(--mute)}
main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px;align-items:start}
aside,.card{background:var(--panel);border:1px solid var(--line);border-radius:6px}
aside{padding:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:16px;max-height:calc(100vh - 32px)}
#dz{border:2px dashed var(--line);border-radius:6px;padding:22px 10px;text-align:center;color:var(--mute);cursor:pointer}
#dz.on,#dz:hover,#dz:focus-visible{border-color:var(--acc);color:var(--acc);outline:none}
#files div{padding:2px 0;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#files .ok{color:var(--ink)}#files b{display:inline-block;width:38px;color:var(--acc)}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mute)}
select,button,input{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
#go{background:var(--acc);color:#fff;border-color:var(--acc);padding:8px;font-weight:600;cursor:pointer}
#go:disabled{opacity:.45;cursor:default}
#st{color:var(--warn);min-height:1.4em}
#tbl{overflow:auto;border-top:1px solid var(--line);flex:1}
#tbl div{display:grid;grid-template-columns:1fr auto;padding:5px 2px;cursor:pointer;border-bottom:1px solid var(--line)}
#tbl div:hover,#tbl .sel{background:#e3f0ee}
#tbl small{color:var(--mute);grid-column:1/3}
.card{margin-bottom:16px;overflow:hidden}
.card h2{margin:0;padding:10px 14px;font-size:15px;font-weight:650;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-weight:400;color:var(--mute)}
.igv{min-height:120px;padding:4px 8px}
@media(max-width:800px){main{grid-template-columns:1fr}aside{position:static;max-height:none}}
</style>
</head>
<body>
<header><h1>Visionneuse shallow genome</h1><span>Tout reste sur votre machine : les fichiers ne sont pas envoyés.</span></header>
<main>
<aside>
  <div id="dz" tabindex="0">Déposez ici le BAM, son BAI et le BED des CNV<br><small>ou cliquez pour parcourir</small></div>
  <input id="inp" type="file" multiple hidden>
  <div id="files"></div>
  <label>Génome <select id="genome"><option value="hg38">hg38</option><option value="hg19">hg19</option></select></label>
  <label>Taille des bins (kb) <input id="bin" type="number" min="1" step="1" value="15" style="width:80px"></label>
  <label>Lissage : médiane glissante (nb de bins, 1 = aucun) <input id="sm" type="number" min="1" step="2" value="1" style="width:80px"></label>
  <label>Moyenne mobile sur la piste mosaïque (nb de bins, 0 = aucune) <input id="ma" type="number" min="0" step="1" value="21" style="width:80px"></label>
  <button id="go" disabled>Visualiser</button>
  <div id="st"></div>
  <div id="tbl"></div>
</aside>
<section>
  <div class="card">
    <h2>Chromosome entier <small>ratio log2 par bin, pour repérer les mosaïques</small></h2>
    <div style="padding:8px 14px"><label>Chromosome <select id="chr"></select></label></div>
    <div id="igv1" class="igv"></div>
  </div>
  <div class="card">
    <h2>Région du CNV <small>gènes, couverture et reads</small></h2>
    <div id="igv2" class="igv"></div>
  </div>
</section>
</main>
<script>
const $=s=>document.querySelector(s), esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const S={bam:null,bai:null,bed:null,br:[],cnv:[]};
const CHRS=[...Array(22)].map((_,i)=>'chr'+(i+1)).concat('chrX','chrY');
$('#chr').innerHTML=CHRS.map(c=>`<option>${c}</option>`).join('');
const dz=$('#dz'),inp=$('#inp');
dz.onclick=()=>inp.click();
dz.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')inp.click()};
dz.ondragover=e=>{e.preventDefault();dz.classList.add('on')};
dz.ondragleave=()=>dz.classList.remove('on');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('on');add([...e.dataTransfer.files])};
inp.onchange=()=>add([...inp.files]);

function add(fl){
  for(const f of fl){const n=f.name.toLowerCase();
    if(n.endsWith('.bam'))S.bam=f;else if(n.endsWith('.bai'))S.bai=f;else if(n.endsWith('.bed'))S.bed=f;}
  $('#files').innerHTML=[['BAM',S.bam],['BAI',S.bai],['BED',S.bed]]
    .map(([k,f])=>`<div class="${f?'ok':''}"><b>${k}</b>${f?esc(f.name):'non fourni'}</div>`).join('');
  $('#go').disabled=!(S.bam&&S.bai);
}

/* Décompresse des blocs BGZF complets (utilisée aussi dans les workers) */
const inflate=u=>{const P=[];let q=0,n=0;
  while(q+18<=u.length){const t=(u[q+16]|u[q+17]<<8)+1;if(q+t>u.length)break;
    const d=pako.inflateRaw(u.subarray(q+18,q+t-8));P.push(d);n+=d.length;q+=t}
  const o=new Uint8Array(n);let k=0;for(const d of P){o.set(d,k);k+=d.length}return o};

/* Décompression en parallèle (workers), avec repli sur le thread principal si les workers échouent */
const NB=Math.max(1,Math.min(8,((typeof navigator!=='undefined'&&navigator.hardwareConcurrency)||4)-1));
let ws;
const run=(i,seg)=>new Promise(res=>{
  if(ws===undefined){
    try{const url=URL.createObjectURL(new Blob([`importScripts('https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js');const inflate=${inflate};onmessage=e=>{const o=inflate(e.data);postMessage(o.buffer,[o.buffer])}`],{type:'text/javascript'}));
      ws=[...Array(NB)].map(()=>new Worker(url))}catch(e){ws=false}
  }
  if(!ws)return res(inflate(seg));
  ws[i].onmessage=e=>res(new Uint8Array(e.data));
  ws[i].onerror=()=>{ws=false;res(inflate(seg))};
  ws[i].postMessage(seg);
});
const cat=(a,b)=>{const c=new Uint8Array(a.length+b.length);c.set(a);c.set(b,a.length);return c};

/* BAI : pour chaque chromosome, offsets virtuels du premier et du dernier read (b, e) */
async function readBai(f){
  const dv=new DataView(await f.arrayBuffer());let o=4;
  if(dv.getUint32(0,true)!==0x01494142)throw new Error("Ce fichier n'est pas un BAI valide.");
  const n=dv.getInt32(o,true);o+=4;
  const off=()=>{const lo=dv.getUint32(o,true),hi=dv.getUint32(o+4,true);o+=8;return(hi*65536+(lo>>>16))*65536+(lo&65535)};
  const r=[];
  for(let i=0;i<n;i++){
    let nb=dv.getInt32(o,true),b=Infinity,e=0;o+=4;
    for(;nb>0;nb--){const bin=dv.getUint32(o,true),nc=dv.getInt32(o+4,true);o+=8;
      for(let k=0;k<nc;k++){const s=off(),t=off();if(bin!==37450){if(s<b)b=s;if(t>e)e=t}}}
    o+=4+8*dv.getInt32(o,true);
    r.push(b<Infinity?{b,e}:null);
  }
  return r;
}

/* En-tête BAM : noms et longueurs des chromosomes */
async function readHeader(file){
  const td=new TextDecoder();
  for(let n=1<<20;;n*=4){
    const d=inflate(new Uint8Array(await file.slice(0,n).arrayBuffer()));
    if(d.length>=4&&(d[0]!==66||d[1]!==65||d[2]!==77||d[3]!==1))throw new Error("Ce fichier n'est pas un BAM valide.");
    try{
      const dv=new DataView(d.buffer,d.byteOffset,d.length);
      let q=4;q+=4+dv.getInt32(q,true);const c=dv.getInt32(q,true);q+=4;const refs=[];
      for(let i=0;i<c;i++){const l=dv.getInt32(q,true);
        refs.push({name:td.decode(d.subarray(q+4,q+3+l)),len:dv.getInt32(q+4+l,true)});q+=8+l}
      if(q<=d.length)return refs;
    }catch(e){}
    if(n>=file.size)throw new Error("En-tête BAM illisible.");
  }
}

/* Compte les reads d'un seul chromosome en ne lisant que sa zone du BAM (grâce au BAI) */
async function countRef(file,bin,r,idx,prog){
  const {b,e}=r.rng,c0=Math.floor(b/65536),u0=b-c0*65536,c1=Math.floor(e/65536);
  const cnt=new Uint32Array(Math.ceil(r.len/bin)+1);
  let buf=new Uint8Array(0),p=0,first=true,base=c0,fp=c0,carry=new Uint8Array(0);
  const feed=d=>{
    buf=cat(buf.subarray(p),d);p=0;
    const dv=new DataView(buf.buffer,buf.byteOffset,buf.length);
    while(p+4<=buf.length){
      const bs=dv.getInt32(p,true);if(p+4+bs>buf.length)break;
      if(dv.getInt32(p+4,true)===idx){
        const pos=dv.getInt32(p+8,true),mq=buf[p+13],fl=dv.getUint16(p+18,true);
        if(mq>=10&&!(fl&0xF04))cnt[Math.floor(pos/bin)]++;
      }
      p+=4+bs;
    }
  };
  for(let done=false;!done&&fp<file.size;){
    const chunk=new Uint8Array(await file.slice(fp,Math.min(fp+(32<<20),c1+(1<<17))).arrayBuffer());
    if(!chunk.length)break;fp+=chunk.length;
    const u=cat(carry,chunk),st=[0];let q=0;
    while(q+18<=u.length){const t=(u[q+16]|u[q+17]<<8)+1;if(q+t>u.length)break;if(base+q>c1){done=true;break}q+=t;st.push(q)}
    const nb=st.length-1,per=Math.ceil(nb/NB),jobs=[];
    for(let i=0;i<NB&&i*per<nb;i++)jobs.push(run(i,u.slice(st[i*per],st[Math.min(nb,(i+1)*per)])));
    const outs=await Promise.all(jobs);
    if(first&&outs.length){outs[0]=outs[0].subarray(u0);first=false}
    for(const o of outs)feed(o);
    carry=u.slice(q);base+=q;prog(Math.min(1,(base-c0)/(c1-c0+1)));
  }
  return cnt;
}

/* Médiane de référence : bins non vides des autosomes déjà comptés (à défaut, de tous les chromosomes comptés) */
function calcMed(d){
  const auto=/^chr([1-9]|1\d|2[0-2])$/;let v=[];
  for(const i of d.done)if(auto.test(d.refs[i].nm))d.cnt[i].forEach(c=>c&&v.push(c));
  if(!v.length)for(const i of d.done)d.cnt[i].forEach(c=>c&&v.push(c));
  const a=Float64Array.from(v).sort();d.med=a[a.length>>1]||1;
}

/* Prépare la lecture : en-tête, index, file d'attente des chromosomes (le chromosome demandé en premier) */
async function prepare(bin,pc){
  const refs=await readHeader(S.bam),rng=await readBai(S.bai);
  if(rng.length!==refs.length)throw new Error('Le BAI ne correspond pas à ce BAM.');
  refs.forEach((r,i)=>{r.rng=rng[i];r.nm=r.name.startsWith('chr')?r.name:'chr'+r.name});
  const ok=/^chr([1-9]|1\d|2[0-2]|X|Y)$/,ids=refs.map((r,i)=>i).filter(i=>ok.test(refs[i].nm)&&refs[i].rng);
  if(!ids.length)throw new Error('Aucun read trouvé sur les chromosomes 1-22, X, Y (BAM non trié ?).');
  const k=ids.findIndex(i=>refs[i].nm===pc);if(k>0)ids.unshift(ids.splice(k,1)[0]);
  S.data={refs,cnt:refs.map(()=>new Uint32Array(0)),bin,med:1,done:new Set(),total:ids.length};
  S.q=ids;S.want=null;S.chain=Promise.resolve();S.t0=performance.now();
}

/* Compte n chromosomes de la file ; recharge les pistes quand le chromosome demandé ou le dernier est prêt */
async function pump(n){
  const d=S.data,st=$('#st');
  for(;n>0&&S.q.length&&d===S.data;n--){
    const i=S.q.shift(),r=d.refs[i];
    d.cnt[i]=await countRef(S.bam,d.bin,r,i,p=>{if(d===S.data)st.textContent=`Comptage ${r.nm} (${d.done.size+1}/${d.total}) : ${Math.round(p*100)} %`});
    d.done.add(i);
    if(d===S.data&&S.br.length===2&&(i===S.want||!S.q.length))S.chain=S.chain.then(setRatio).catch(()=>{});
  }
  if(d===S.data&&!S.q.length)st.textContent=`Comptage terminé en ${Math.round((performance.now()-S.t0)/1000)} s`;
}
/* Passe un chromosome en tête de file (s'il n'est pas encore compté) */
function want(nm){
  const d=S.data;if(!d)return;
  const i=d.refs.findIndex(r=>r.nm===nm),k=S.q.indexOf(i);
  if(k>=0){S.want=i;if(k>0){S.q.splice(k,1);S.q.unshift(i)}}
}

/* Valeurs log2 par bin d'un chromosome (null = bin vide) */
const vals=(d,i)=>Array.from(d.cnt[i],c=>c?Math.log2(c/d.med):null);

/* Génère le bedgraph log2 ratio, avec médiane glissante sur w bins (w=1 : aucun lissage) */
function mkBg(d,w){
  const {refs,bin}=d,h=w>>1,keep=/^chr([1-9]|1\d|2[0-2]|X|Y)$/;let out='';
  refs.forEach((r,i)=>{if(!keep.test(r.nm))return;const L=vals(d,i);
    for(let j=0;j<L.length;j++){
      if(L[j]==null||j*bin>=r.len)continue;
      let x=L[j];
      if(h){const v=[];for(let k=Math.max(0,j-h);k<=Math.min(L.length-1,j+h);k++)if(L[k]!=null)v.push(L[k]);v.sort((a,b)=>a-b);x=v[v.length>>1]}
      out+=`${r.nm}\t${j*bin}\t${Math.min((j+1)*bin,r.len)}\t${x.toFixed(3)}\n`;
    }});
  return new File([out],'log2ratio.bedgraph');
}

/* Moyenne mobile du log2 ratio sur w bins (les bins vides sont ignorés) */
function mkMA(d,w){
  const {refs,bin}=d,h=w>>1,keep=/^chr([1-9]|1\d|2[0-2]|X|Y)$/;let out='';
  refs.forEach((r,i)=>{if(!keep.test(r.nm))return;const L=vals(d,i);
    for(let j=0;j<L.length;j++){
      if(L[j]==null||j*bin>=r.len)continue;
      let s=0,n=0;for(let k=Math.max(0,j-h);k<=Math.min(L.length-1,j+h);k++)if(L[k]!=null){s+=L[k];n++}
      out+=`${r.nm}\t${j*bin}\t${Math.min((j+1)*bin,r.len)}\t${(s/n).toFixed(3)}\n`;
    }});
  return new File([out],'moyenne_mobile.bedgraph');
}

/* (Re)charge la piste de ratio dans les deux vues, sans recompter les reads */
async function setRatio(){
  calcMed(S.data);
  const w=Math.max(1,Math.round(+$('#sm').value)||1),[a,b]=S.br;
  const cfg={name:`log2 ratio (${S.data.bin/1000} kb${w>1?', médiane '+w+' bins':''}${S.q.length?', provisoire':''})`,type:'wig',format:'bedgraph',url:mkBg(S.data,w),graphType:'bar',autoscale:false,min:-1.5,max:1.5,height:350,order:2,color:'#2563eb',altColor:'#dc2626'};
  const ma=Math.round(+$('#ma').value)||0,{min:_a,max:_b,...c0}=cfg,pts={...c0,graphType:'points',height:150,autoscale:true,alpha:1};
  const cfgA=ma>1?{type:'merged',name:cfg.name,height:150,order:2,autoscale:true,alpha:1,tracks:[{...pts,name:'log2 ratio'},
    {name:`moyenne mobile (${ma} bins)`,type:'wig',format:'bedgraph',url:mkMA(S.data,ma),graphType:'line',color:'#000000',lineWidth:3,autoscale:true,alpha:1}]}:{...pts};
  (S.tr||[]).forEach(([br,t])=>br.removeTrack(t));
  S.tr=[[a,await a.loadTrack(cfgA)],[b,await b.loadTrack({...cfg})]];
  if(S.bamCfg)S.tr.push([b,await b.loadTrack({...S.bamCfg})]);
}
$('#sm').onchange=$('#ma').onchange=()=>{if(S.data&&S.br.length)setRatio()};

async function parseBed(){
  if(!S.bed)return [];
  return (await S.bed.text()).split('\n').filter(l=>l.trim()&&!/^(track|browser|#)/.test(l))
    .map(l=>l.trim().split(/\s+/)).filter(c=>c.length>=3&&+c[1]>=0&&+c[2]>0)
    .map(c=>{const x=c[3]||'',f=parseFloat(x),v=!isNaN(f)?f:/del|loss/i.test(x)?-1:/dup|gain|amp/i.test(x)?1:null;
      return {chr:c[0].startsWith('chr')?c[0]:'chr'+c[0],s:+c[1],e:+c[2],n:x,z:c[4]||'',v}});
}
const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+' Mb':n>=1e3?(n/1e3).toFixed(0)+' kb':n+' pb';
const lab=c=>(isNaN(parseFloat(c.n))?c.n:'log2 '+c.n)+(c.z?(c.n?', ':'')+'z-score '+c.z:'');

function show(i){
  const c=S.cnv[i];if(!c||!S.br[1])return;
  const pad=Math.max(1e4,Math.round((c.e-c.s)*.25));
  S.br[1].search(`${c.chr}:${Math.max(1,c.s-pad)}-${c.e+pad}`);
  S.br[0].search(c.chr);want(c.chr);$('#chr').value=c.chr;
  document.querySelectorAll('#tbl div').forEach((d,k)=>d.classList.toggle('sel',k===i));
}

$('#go').onclick=async()=>{
  const g=$('#genome').value,bin=Math.round(+$('#bin').value*1000),st=$('#st');
  if(!(bin>=100)){st.textContent='Indiquez une taille de bin en kb (0,1 ou plus).';return}
  $('#go').disabled=true;st.textContent='';
  S.br.forEach(b=>igv.removeBrowser(b));S.br=[];
  try{
    S.cnv=await parseBed();
    $('#tbl').innerHTML=S.cnv.map((c,i)=>`<div data-i="${i}"><span>${c.chr}:${c.s+1}-${c.e}</span><span>${fmt(c.e-c.s)}</span><small>${esc(lab(c))}</small></div>`).join('');
    $('#tbl').onclick=e=>{const d=e.target.closest('div[data-i]');if(d)show(+d.dataset.i)};
    await prepare(bin,S.cnv[0]&&S.cnv[0].chr);
    await pump(1);
    S.bamCfg={name:S.bam.name,type:'alignment',format:'bam',url:S.bam,indexURL:S.bai,visibilityWindow:1e6,displayMode:'SQUISHED',order:4};
    const first=S.cnv[0],tr=[];
    const gene={name:'Gènes (RefSeq)',type:'annotation',format:'refgene',indexed:false,displayMode:'EXPANDED',order:3,
      url:`https://hgdownload.soe.ucsc.edu/goldenPath/${g}/database/${g==='hg38'?'ncbiRefSeqSelect':'refGene'}.txt.gz`};
    S.br.push(await igv.createBrowser($('#igv1'),{genome:g,loadDefaultGenomeTracks:false,locus:first?first.chr:'chr1',tracks:tr.map(t=>({...t}))}));
    S.br.push(await igv.createBrowser($('#igv2'),{genome:g,loadDefaultGenomeTracks:false,locus:'chr1',tracks:[...tr.map(t=>({...t})),gene]}));
    for(const b of S.br)for(const t of b.findTracks(t=>/refseq.*all/i.test(t.name||'')))b.removeTrack(t);
    S.tr=[];await setRatio();
    pump(1e9).catch(e=>{st.textContent=e.message||String(e)});
    if(first){$('#chr').value=first.chr;show(0)}
  }catch(e){st.textContent=e.message||String(e)}
  $('#go').disabled=false;
};
$('#chr').onchange=e=>{if(S.br[0]){want(e.target.value);S.br[0].search(e.target.value)}};
</script>
</body>
</html>
